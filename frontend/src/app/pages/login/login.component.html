<p>login works!</p>
<div class="login-container">
  <div class="login-card">
    <h1>TaskFlow</h1>
    <p class="subtitle">Entre na sua conta</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="request.email" placeholder="seu@email.com" />
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" [(ngModel)]="request.password" placeholder="••••••••" />
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button (click)="onLogin()" [disabled]="isLoading">
      {{ isLoading ? 'Entrando...' : 'Entrar' }}
    </button>
  </div>
</div>
